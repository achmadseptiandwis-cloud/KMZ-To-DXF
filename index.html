<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KMZ / KML to DXF Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #f8fafc;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .header { text-align: center; margin-bottom: 24px; }
    .header h2 { font-size: 22px; font-weight: 700; color: #ffffff; margin-bottom: 8px; }
    .header p { font-size: 13.5px; color: #94a3b8; }
    .dropzone {
      border: 2px dashed #475569;
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      background: #0f172a;
      position: relative;
    }
    .dropzone input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
    }
    .btn {
      background: #3b82f6;
      color: white;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }
    .btn:hover { background: #2563eb; }
    .status-text { margin-top: 16px; font-size: 13px; text-align: center; color: #94a3b8; }
    .status-text.success { color: #4ade80; }
    .status-text.error { color: #f87171; }
    .file-name { margin-top: 8px; font-size: 13px; color: #38bdf8; font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Converter KMZ / KML ke DXF</h2>
    <p>Format DXF ASCII R12 Kompatibel AutoCAD 2000–2026</p>
  </div>

  <div class="dropzone">
    <input type="file" id="fileInput" accept=".kmz,.kml" onchange="showFileName(this)">
    <div style="color: #64748b; margin-bottom: 8px;">📁 Klik atau drag file .kmz / .kml di sini</div>
    <div class="file-name" id="fileName"></div>
  </div>

  <button class="btn" onclick="processFile()">Konversi & Unduh DXF</button>

  <div class="status-text" id="status"></div>
</div>

<script>
  function showFileName(input) {
    document.getElementById('fileName').innerText = input.files[0] ? input.files[0].name : '';
  }

  function getUTMProjString(lon, lat) {
    const zone = Math.floor((lon + 180) / 6) + 1;
    const hemisphere = lat >= 0 ? '+north' : '+south';
    return `+proj=utm +zone=${zone} ${hemisphere} +datum=WGS84 +units=m +no_defs`;
  }

  function cleanString(str) {
    if (!str) return 'LAYER_0';
    return str.replace(/[^a-zA-Z0-9_-]/g, '_').toUpperCase().substring(0, 31) || 'LAYER_0';
  }

  function getFolderName(placemarkNode) {
    let current = placemarkNode.parentNode;
    while (current && current.nodeType === 1) {
      if (current.tagName.toLowerCase() === 'folder') {
        const nameElem = current.getElementsByTagName('name')[0];
        if (nameElem && nameElem.textContent.trim()) {
          return nameElem.textContent.trim();
        }
      }
      current = current.parentNode;
    }
    return 'OBJEK_KML';
  }

  async function processFile() {
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');

    if (!fileInput.files.length) {
      status.className = 'status-text error';
      status.innerText = 'Pilih file KMZ atau KML terlebih dahulu!';
      return;
    }

    const file = fileInput.files[0];
    status.className = 'status-text';
    status.innerText = 'Memproses data geospasial...';

    try {
      let kmlText = '';
      if (file.name.endsWith('.kmz')) {
        const zip = await JSZip.loadAsync(file);
        const kmlFile = Object.keys(zip.files).find(name => name.endsWith('.kml'));
        if (!kmlFile) throw new Error('File KML tidak ditemukan di dalam KMZ.');
        kmlText = await zip.files[kmlFile].async('string');
      } else {
        kmlText = await file.text();
      }

      const dxfContent = buildCleanDXF(kmlText);

      const blob = new Blob([dxfContent], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.name.replace(/\.(kmz|kml)$/i, '') + '_fix.dxf';
      a.click();
      URL.revokeObjectURL(url);

      status.className = 'status-text success';
      status.innerText = '✓ Selesai! Buka file DXF baru ini di AutoCAD.';
    } catch (err) {
      console.error(err);
      status.className = 'status-text error';
      status.innerText = 'Error: ' + err.message;
    }
  }

  function buildCleanDXF(kmlText) {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(kmlText, 'text/xml');
    const placemarks = xmlDoc.getElementsByTagName('Placemark');

    let firstLon = null, firstLat = null;
    for (let i = 0; i < placemarks.length; i++) {
      const coordElem = placemarks[i].getElementsByTagName('coordinates')[0];
      if (coordElem) {
        const firstCoord = coordElem.textContent.trim().split(/\s+/)[0].split(',');
        firstLon = parseFloat(firstCoord[0]);
        firstLat = parseFloat(firstCoord[1]);
        if (!isNaN(firstLon) && !isNaN(firstLat)) break;
      }
    }

    if (firstLon === null || firstLat === null) {
      throw new Error('Tidak ada koordinat valid ditemukan.');
    }

    const utmProj = getUTMProjString(firstLon, firstLat);

    let lines = [];
    const addLine = (code, val) => {
      lines.push(code.toString());
      lines.push(val.toString());
    };

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

    function convertCoords(text) {
      return text.trim().split(/\s+/).map(str => {
        const parts = str.split(',');
        if (parts.length >= 2) {
          const lon = parseFloat(parts[0]);
          const lat = parseFloat(parts[1]);
          const elev = parts[2] ? parseFloat(parts[2]) : 0;
          if (!isNaN(lon) && !isNaN(lat)) {
            const [x, y] = proj4(utmProj, [lon, lat]);
            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
            return { x, y, elev };
          }
        }
        return null;
      }).filter(item => item !== null);
    }

    const layers = new Set(['0', 'PENANDA']);
    let entityBuffer = [];

    const addEnt = (code, val) => {
      entityBuffer.push(code.toString());
      entityBuffer.push(val.toString());
    };

    for (let i = 0; i < placemarks.length; i++) {
      const pm = placemarks[i];
      const nameElem = pm.getElementsByTagName('name')[0];
      const rawName = nameElem ? nameElem.textContent.trim() : `Point_${i+1}`;
      const layerName = cleanString(getFolderName(pm));
      layers.add(layerName);

      const pointElem = pm.getElementsByTagName('Point')[0];
      const lineElem = pm.getElementsByTagName('LineString')[0];
      const polyElem = pm.getElementsByTagName('Polygon')[0];

      // Point / Marker
      if (pointElem) {
        const coordElem = pointElem.getElementsByTagName('coordinates')[0];
        if (coordElem) {
          const pts = convertCoords(coordElem.textContent);
          if (pts.length > 0) {
            addEnt(0, 'POINT');
            addEnt(8, layerName);
            addEnt(10, pts[0].x.toFixed(4));
            addEnt(20, pts[0].y.toFixed(4));
            addEnt(30, pts[0].elev.toFixed(4));

            addEnt(0, 'TEXT');
            addEnt(8, layerName);
            addEnt(10, (pts[0].x + 1.5).toFixed(4));
            addEnt(20, (pts[0].y + 1.5).toFixed(4));
            addEnt(30, pts[0].elev.toFixed(4));
            addEnt(40, '2.0');
            addEnt(1, rawName.replace(/[^\x20-\x7E]/g, ''));
          }
        }
      }

      // Polyline LineString
      if (lineElem) {
        const coordElem = lineElem.getElementsByTagName('coordinates')[0];
        if (coordElem) {
          const pts = convertCoords(coordElem.textContent);
          if (pts.length > 1) {
            addEnt(0, 'POLYLINE');
            addEnt(8, layerName);
            addEnt(66, '1');
            addEnt(70, '0');
            for (let p of pts) {
              addEnt(0, 'VERTEX');
              addEnt(8, layerName);
              addEnt(10, p.x.toFixed(4));
              addEnt(20, p.y.toFixed(4));
              addEnt(30, p.elev.toFixed(4));
            }
            addEnt(0, 'SEQEND');
            addEnt(8, layerName);
          }
        }
      }

      // Polyline Polygon
      if (polyElem) {
        const coordElem = polyElem.getElementsByTagName('coordinates')[0];
        if (coordElem) {
          const pts = convertCoords(coordElem.textContent);
          if (pts.length > 1) {
            addEnt(0, 'POLYLINE');
            addEnt(8, layerName);
            addEnt(66, '1');
            addEnt(70, '1'); // Closed
            for (let p of pts) {
              addEnt(0, 'VERTEX');
              addEnt(8, layerName);
              addEnt(10, p.x.toFixed(4));
              addEnt(20, p.y.toFixed(4));
              addEnt(30, p.elev.toFixed(4));
            }
            addEnt(0, 'SEQEND');
            addEnt(8, layerName);
          }
        }
      }
    }

    if (minX === Infinity) { minX = 0; minY = 0; maxX = 100; maxY = 100; }

    // === HEADER SECTION ===
    addLine(0, 'SECTION');
    addLine(2, 'HEADER');
    addLine(9, '$ACADVER');
    addLine(1, 'AC1009'); // R12 ASCII DXF
    addLine(9, '$EXTMIN');
    addLine(10, minX.toFixed(4));
    addLine(20, minY.toFixed(4));
    addLine(30, '0.0');
    addLine(9, '$EXTMAX');
    addLine(10, maxX.toFixed(4));
    addLine(20, maxY.toFixed(4));
    addLine(30, '0.0');
    addLine(0, 'ENDSEC');

    // === TABLES SECTION ===
    addLine(0, 'SECTION');
    addLine(2, 'TABLES');

    // Linetype Table
    addLine(0, 'TABLE');
    addLine(2, 'LTYPE');
    addLine(70, '1');
    addLine(0, 'LTYPE');
    addLine(2, 'CONTINUOUS');
    addLine(70, '0');
    addLine(3, 'Solid line');
    addLine(72, '65');
    addLine(73, '0');
    addLine(40, '0.0');
    addLine(0, 'ENDTAB');

    // Layer Table
    addLine(0, 'TABLE');
    addLine(2, 'LAYER');
    addLine(70, layers.size);
    layers.forEach(lyr => {
      addLine(0, 'LAYER');
      addLine(2, lyr);
      addLine(70, '0');
      addLine(62, '7');
      addLine(6, 'CONTINUOUS');
    });
    addLine(0, 'ENDTAB');

    addLine(0, 'ENDSEC');

    // === BLOCKS SECTION ===
    addLine(0, 'SECTION');
    addLine(2, 'BLOCKS');
    addLine(0, 'ENDSEC');

    // === ENTITIES SECTION ===
    addLine(0, 'SECTION');
    addLine(2, 'ENTITIES');
    lines = lines.concat(entityBuffer);
    addLine(0, 'ENDSEC');

    // === EOF ===
    addLine(0, 'EOF');

    return lines.join('\n');
  }
</script>

</body>
</html>
